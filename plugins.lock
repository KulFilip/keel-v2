# The released plugins keel's image takes when it is built with PLUGINS=lock (docs/plugins/16-steps5-7-contract.md,
# step 5): docker build --build-arg PLUGINS=lock . The default, PLUGINS=source, builds plugins/ from this repo and does
# not read this file.
#
# One line per plugin:   <name> <version> <url> sha256:<hex>
# The signature is at <url>.minisig, made with the keel publisher key; the build checks it with content/trust/keel.pub
# (scripts/fetch-locked-plugins.sh). A plugin a locked plugin needs must be locked too. keel Product's line is used
# only with EDITION=product.
#
# scripts/update-plugins-lock.sh [name …] writes the lines from the plugins' newest releases in keel-studio.
# No plugin is released yet, so there is no line yet.
