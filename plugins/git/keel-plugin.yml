# Git as a plugin (docs/plugins/11-step3-contract.md, wave B). scripts/build-plugin.sh packs it: git-<version>.kplug.
# Paths are relative to the plugin folder. The version must equal VERSION in engine/keel_plugin_git/__init__.py
# (engine/tests/test_git_part.py checks it). Each part is written on one line (scripts/build-plugin.sh reads them).
# What flows need stays in keel's core: the git helper (Workspace, tools/git.py), Connections › GitHub (the token) and
# "open the pull request" in ship. The Code page's branch tab (the Code plugin's) shows a branch with this plugin's api.
schema: 1
name: git
title: Git
version: 1.0.0
publisher: keel
summary: Branches, commits, pushes and pull requests for KeelBot and workflows, with keel's rules.
requires:
  sdk: 1
parts:
  engine: { path: engine, package: keel_plugin_git }
  api: { jars: [api/keel-plugin-git.jar] }
  web: { entry: web/index.js }
  content: content
per_project: true
# keel TUI (docs/plugins/25-tui-plugins.md): /git status | log | diff [path], and the branch panel (Ctrl+G). Data only:
# each calls this plugin's own api routes, and says how the answer reads.
contributes:
  tui:
    commands:
      - name: git
        args: "<status|log|diff [path]>"
        summary: the branch and its changes, its last commits, or the uncommitted diff
        sub:
          status:
            summary: the branch, how far from its base, and the files that changed
            call: { path: "/projects/{pid}/git/status" }
            show: { title: "{branch} · base {base} · ahead {ahead} · behind {behind}", items: changes, line: "{status}  {path}", empty: "nothing changed" }
          log:
            summary: the last commits on this branch
            call: { path: "/projects/{pid}/git/log" }
            show: { items: ".", line: "{sha}  {date}  {author}  {subject}", max: 20 }
          diff:
            summary: the uncommitted changes as a diff (one file with a path)
            call: { path: "/projects/{pid}/git/diff?path={arg}" }
            show: { diff: diff, empty: "no uncommitted change" }
    panel:
      title: Branch
      key: g
      every: 10
      call: { path: "/projects/{pid}/git/status" }
      show: { title: "{branch} · base {base} · ↑{ahead} ↓{behind}", items: changes, line: "{status}  {path}", empty: "clean", max: 6 }
