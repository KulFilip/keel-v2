# The bug flow: reproduce with a failing test, Gate R, investigate in parallel, Gate F (the plan unlocks production
# code), fix, an optional regression e2e, then ship (its steps are included, ids ship_*).
#
# The bug's id BUG-<n> is the flow's criterion (bug_intake): the reproducing test is named after it, only that test
# decides red (verify_red) and it must pass after the fix with the whole suite (verify_green); the commits are
# test(BUG-<n>) and fix(BUG-<n>) (with the root cause in the body), so trace --strict and the PR body name it.
#
# Inputs (StartThread.data / a start_flow seed):
#   no_gates            waives both gates and says so in the PR body (or gates.bug_gates: false in .keel/config.yml)
#   recipe, symptoms    from diagnose or hunt; they go to the reproducer
#   needs_e2e           makes the regression e2e mandatory
#
# Every step lists its keys in the same order: id, kind, name, phase, then what the kind needs, then instructions.
# A branch's "no" is quoted: YAML 1.1 reads a bare no: key as false.

id: fix
name: fix (keel)
version: 1
keel_rules: true

steps:

  # ---- 1. Reproduce: a failing test from the symptom alone ---------------------------------------------------------

  - id: intake
    kind: code
    name: bug report
    phase: bug-report
    action: bug_intake

  - id: repro
    kind: agent
    name: bug-repro
    phase: bug-repro
    agent: reproducer
    model: default
    markers: [REPRO, LAYER]
    instructions: >-
      Work from the symptom (and the reproduction recipe, when there is one) alone. Write the smallest failing test at
      the lowest layer that shows it, and name it after the bug's id {{data.bug.id}} so keel can run it alone. Never
      weaken an assertion until something goes red. LAYER: WEB when your test is a web (frontend) test, else API.

  - id: reproduced
    kind: branch
    name: reproduced
    phase: bug-repro
    when:
      marker: REPRO
      equals: confirmed
      step: repro
    "no": to_diagnose

  - id: verify_repro
    kind: code
    name: verify red + commit
    phase: bug-repro
    action: verify_red+commit
    lock: true

  # ---- 2. Gate R: is this the bug? --------------------------------------------------------------------------------

  # It shows the reproducing test (file::name), the command and the failure. reject (reproduce differently) drops the
  # rejected test with its commit, so the next test replaces it instead of stacking a second one.
  - id: gate_r
    kind: gate
    name: gate R
    phase: gate-r
    choices: { investigate: hypotheses, reject: drop_red, stop: keep_test }
    lock: true

  - id: keep_test
    kind: code
    name: stop; the reproducing test stays on the branch
    phase: gate-r
    then: end

  - id: drop_red
    kind: code
    name: drop the rejected test and reproduce again
    phase: bug-repro
    action: bug_drop_red
    then: repro

  # ---- 3. Investigate: hypotheses, one investigator each, the findings -------------------------------------------

  - id: hypotheses
    kind: agent
    name: hypotheses
    phase: bug-investigate
    agent: investigator
    model: default
    collect: hypotheses
    instructions: >-
      The failing test is committed (the test({{data.bug.id}}) commit). List two to four distinct plausible causes,
      each one testable on its own. Do not investigate them yet. What earlier fix attempts ruled out (do not list
      those again): {{data.learned}}

      {{data.evidence_note}}

  - id: investigate
    kind: parallel
    name: one investigator per hypothesis
    phase: bug-investigate
    agent: investigator
    model: default
    from: hypotheses
    cap: 4
    markers: [ROOT-CAUSE]
    instructions: >-
      Confirm or kill only the hypothesis in your item, from evidence: the failing test, code, history, logs, read-only
      queries. Nothing may be edited. ROOT-CAUSE: confirmed means confirmed, not believed. What earlier fix attempts
      ruled out: {{data.learned}}

      {{data.evidence_note}}

  - id: findings
    kind: code
    name: collect the findings
    phase: bug-investigate
    action: report

  - id: confirmed
    kind: branch
    name: a cause is confirmed
    phase: bug-investigate
    when:
      marker: ROOT-CAUSE
      equals: confirmed
      step: investigate
      any: true
    "no": escalated

  - id: plan
    kind: agent
    name: fix plan
    phase: bug-investigate
    agent: investigator
    model: default
    markers: [E2E]
    instructions: >-
      Write the fix plan for Gate F. Start with a "Root cause:" line (one or two sentences: it goes into the fix
      commit's body), then the evidence for it, the files to change, the approach, the risk, one alternative, and
      whether a regression end-to-end test is needed (E2E: yes when the bug was user-visible across both apps or
      invisible to a unit test, else no). Fix the cause narrowly; no refactoring.

      {{data.symptoms_note}}

      {{data.evidence_note}}

      The investigators' answers:

      {{data.report}}

  - id: plan_report
    kind: code
    name: plan for gate F
    phase: bug-investigate
    action: report+bug_plan

  # ---- 4. Gate F: the plan unlocks production code (or it is a missing requirement) -------------------------------

  # fix: the plan is right. investigate: the cause is not proven yet, new hypotheses (with your note). feature: a
  # missing requirement. reject: change the approach, the plan is written again with your note.
  - id: gate_f
    kind: gate
    name: gate F
    phase: gate-f
    choices: { fix: fix, investigate: hypotheses, feature: hand_feature, reject: plan }
    lock: true

  - id: hand_feature
    kind: code
    name: start the feature flow with the evidence
    phase: gate-f
    action: start_flow
    flow: feature
    seed:
      title: $title
      evidence: $data.report
    then: end

  # ---- 5. Fix: change the cause, never the test --------------------------------------------------------------------

  - id: fix
    kind: agent
    name: bug-fix
    phase: bug-fix
    agent: implementer
    model: default
    instructions: >-
      Change the cause, never the test (tests are frozen in this phase). Touch only the files the approved plan names
      and explain any extra one. Put the root cause in your summary. The approved plan:

      {{data.report}}

  # keel v1 fix.md: the first failure means the cause was wrong, so it goes back to the investigation (and Gate F); the
  # second resets (keel's uncommitted changes go back, what was learned is kept) and investigates again.
  - id: verify_fix
    kind: code
    name: verify + commit
    phase: bug-fix
    action: verify_green+commit
    lock: true
    rounds: 1
    back: hypotheses
    after_rounds: reset

  # ---- 6. Regression e2e, when the plan (or the request) says it is needed ----------------------------------------

  - id: e2e_needed
    kind: branch
    name: regression e2e needed
    phase: bug-fix
    when:
      marker: E2E
      equals: "yes"
      step: [intake, plan]
    "no": ship_plan

  - id: e2e
    kind: agent
    name: regression e2e
    phase: e2e
    agent: e2e-author
    model: default
    markers: [E2E-RESULT]
    instructions: >-
      Write one end-to-end test for the journey that used to break, run it, and keep it only if it adds cover the
      reproducing test does not.

  - id: e2e_commit
    kind: code
    name: commit e2e
    phase: e2e
    action: commit

  # ---- 7. Ship (the ship flow's steps, ids ship_*), then done ------------------------------------------------------

  - id: ship
    kind: include
    name: ship
    flow: ship

  - id: finish
    kind: code
    name: done
    phase: close
    then: end

  # ---- Side paths, reached only by a jump -------------------------------------------------------------------------

  - id: escalated
    kind: branch
    name: model already escalated
    phase: bug-investigate
    when:
      marker: ESCALATED
      equals: "yes"
      step: escalate
    "no": escalate

  - id: to_diagnose
    kind: code
    name: hand to diagnose
    phase: bug-investigate
    action: start_flow
    flow: diagnose
    seed:
      title: $title
      symptoms: [$request]
      evidence: $data.report
    then: end

  - id: escalate
    kind: code
    name: escalate the investigator's model once
    phase: bug-investigate
    action: escalate_model
    agent: investigator
    then: investigate

  - id: reset
    kind: code
    name: reset and investigate again
    phase: reset
    action: bug_reset
    then: hypotheses
