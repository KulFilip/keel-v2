id: implement
name: implement (keel)
keel_rules: true
version: 1
# The usual order, not test-first (keel 0.18.12): the implementer writes the code, the test author writes the tests for
# it, keel runs them. They pass: keel commits the code and its tests together and the flow is done. They fail: an
# implementer fixes the code (or a test that is wrong, with a reason) and keel runs them again, up to 2 rounds, then
# keel asks. No gate: start it when you trust the change to land once its tests pass.
steps:
  - { id: preflight, kind: code, name: preflight + own branch, action: preflight, phase: preflight }
  - id: implement
    kind: agent
    name: write the code
    agent: implementer
    model: default
    phase: green
    instructions: >-
      Write the code for the request, in the files it needs and no more, following how this project already does
      things. Write no tests: the test author writes them next, for what you built. Say in a few lines what you changed
      and how it can be tested.
  - id: tests
    kind: agent
    name: write the tests
    agent: test-author
    model: default
    phase: red
    instructions: >-
      The implementer just wrote the code for the request (the uncommitted changes). Write tests that prove it works:
      the main case, a wrong input and an edge case, in the project's own test style. They should pass now. If a test
      fails because the code is wrong, keep the test and say what is wrong; never weaken a test to make it pass.
  - id: fix
    kind: agent
    name: fix what fails
    agent: implementer
    model: default
    phase: ac
    retry_only: true
    instructions: >-
      The tests fail. Fix the code so they pass. Change a test only when it is wrong against the request, and say why
      in one line.
  - { id: verify, kind: code, name: run the tests, action: verify_green, phase: ac, back: fix, rounds: 2, lock: true }
  - { id: commit, kind: code, name: commit the code and its tests, action: commit, lock: true, phase: ac }
  - { id: close, kind: code, name: done, action: close_flow, then: end, phase: close }
