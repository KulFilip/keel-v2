id: spike
name: spike (keel)
keel_rules: true
version: 1
# Research before building: frame the question, research each angle from evidence and measurements, write the findings
# with data and one recommendation, and let the person decide. Phase spec: agents may write notes and the spec, never
# code or tests. "spec" starts a feature flow from the findings (its spec step writes the spec); "drop" ends here.
steps:
  - id: frame
    kind: agent
    name: frame the question
    agent: explorer
    model: default
    phase: spec
    collect: angles
    instructions: >-
      Frame the spike: restate the question in one sentence, the decision it should make possible, and what data
      would settle it (numbers, limits, versions, compatibility, cost, effort). Then list two to four distinct angles to
      research (options, approaches or tools), each one researchable on its own. Do not research them yet.
  - id: research
    kind: parallel
    name: one researcher per angle
    agent: investigator
    model: default
    from: angles
    cap: 4
    phase: spec
    markers: [VERDICT]
    instructions: >-
      Research only the angle in your item, from evidence: the code (file:line), its dependencies and docs, and
      measurements you can take without changing anything (timings, counts, sizes, versions, a dry run). Edit nothing.
      Give numbers wherever you can and say how you got each one. Name the risks and what the angle would cost to
      build. End with VERDICT: promising | possible | no.
  - { id: collect, kind: code, name: collect the findings, action: report, phase: spec }
  - id: findings
    kind: agent
    name: findings + recommendation
    agent: investigator
    model: default
    phase: spec
    markers: [RECOMMEND]
    instructions: >-
      Write the spike's findings for the person who decides: the question; per angle what was found, with its data
      and evidence; a comparison table (angle, verdict, the key numbers, risk, effort); open questions; and one
      recommendation with its reason. RECOMMEND is that recommendation on one line. The researchers' answers:

      {{data.report}}
  - { id: report, kind: code, name: findings report, action: report, phase: spec }
  - id: decide
    kind: gate
    name: spike result
    back: frame
    lock: true
    phase: spec
    choices: { spec: hand_spec, drop: end }
  - id: hand_spec
    kind: code
    name: start a feature flow from the findings
    action: start_flow
    flow: feature
    then: end
    phase: spec
    seed: { title: $title, evidence: $data.report }
