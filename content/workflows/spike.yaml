id: spike
name: spike (keel)
keel_rules: true
version: 1
# Research before building: frame the question (0.18.21: with one round of questions about the decision when only
# the person knows the answer; 0.18.23: about the decision only, how to build it goes to the spec as open
# questions), research what it needs from outside the repo on the web (0.18.20 web_docs: the web-researcher searches
# first and reads at least five sources), research each angle from evidence and measurements, write the findings
# with data, sources and one recommendation (0.18.21: evidence with file:line or URL, draft criteria, test layers,
# risks and cost, kept whole: the report adds each angle's answer word for word and seeds
# the feature's evidence; 0.18.23: the report starts with a summary, keeps each angle's clean ANGLE REPORT block only,
# lists the angles' conflicts and counts their verdicts in one line), and let the person decide. Phase spec:
# agents may write notes and the spec, never code or tests. "spec" starts a feature flow from the findings (its spec
# step writes the spec); "drop" ends here.
steps:
  - id: frame
    kind: agent
    name: frame the question
    agent: explorer
    model: default
    phase: spec
    collect: angles
    keep: true
    asks: true
    instructions: >-
      Frame the spike: restate the question in one sentence, the decision it should make possible, and what data
      would settle it (numbers, limits, versions, compatibility, cost, effort). Name what the question needs from
      outside this repository (third-party APIs, libraries, SDKs, webhooks, vendor docs: exact field names, formats,
      versions, limits), or say it needs nothing from outside. Then list two to four distinct angles to research
      (options, approaches or tools), each one researchable on its own. Do not research them yet. If the decision
      depends on something only the person knows, ask it once: at most 3 questions, each with 2 to 4 options (the
      recommended one first), in one ```keel-questions block after the angles (a JSON list of {"id", "question",
      "why", "options": [{"label", "description", "recommended"}]}). Ask only about the DECISION the spike must
      support: do we need it at all, for whom, what certainty or what evidence decides it, deadline or cost limits,
      which options to compare. Never ask how to build it (which column or table, overwrite or keep history, which
      systems or APIs read it, a field's format): those belong in the feature's spec interview, so list them under
      "Open questions for the spec" in your framing, and the findings carry them on. When the answers come back,
      frame the spike again with them.
  - { id: frame_questions, kind: gate, name: questions about the decision, phase: spec, when: { state: clarify.questions } }
  - id: web_docs
    kind: agent
    name: research the outside docs
    agent: web-researcher
    model: default
    phase: spec
    keep: true
    markers: [CONFIDENCE]
    instructions: >-
      Research what this spike needs from outside the repository: the third-party APIs, libraries, SDKs, webhooks and
      their docs that the question and its angles depend on (field names, payload formats, versions, limits). Search
      first, then fetch the best sources; never conclude from one failed URL. Edit nothing. If the question needs
      nothing from outside the repository, say so in one line and end with CONFIDENCE: high. The framing, with its
      question and angles:

      {{data.frame_text}}
  - id: research
    kind: parallel
    name: one researcher per angle
    agent: investigator
    model: default
    from: angles
    cap: 4
    phase: spec
    markers: [VERDICT]
    instructions: >-
      Research only the angle in your item, from evidence: the code (file:line), its dependencies and docs, and
      measurements you can take without changing anything (timings, counts, sizes, versions, a dry run). Edit nothing.
      Use the web research below for anything outside the repository, and cite its URLs; when your angle needs more
      from outside, read the web yourself (WebSearch and WebFetch when you have them, else a read-only `curl -sL <url>`)
      and name each URL you used. Give numbers wherever you can and say how you got each one. Write your findings as a
      list of claims, each with its file:line or URL; trace the paths your angle touches (inbound, internal messages
      and their contract, persistence, outbound) and name the tests that exist for them; mark Unverified what no source
      confirms, with what must be confirmed. Name the risks and what the angle would cost to build (files, migration,
      deploy order). End with your clean report, the only part of your answer the spike's report keeps (your working
      before it is not): a line ANGLE REPORT, then "Answer:" in one or two sentences; "Facts:", a list of
      "- <topic>: <value> — <file:line or URL>" (one topic per line, short topic names such as "where the ETA is
      stored" or "migration needed", so keel can compare the angles); "Unverified:"; "Risks:"; "Cost:" (files,
      migration, size); and last VERDICT: promising | possible | no.

      What the web research found:

      {{data.web_docs_text}}
  - { id: collect, kind: code, name: collect the findings, action: report, phase: spec }
  - id: findings
    kind: agent
    name: findings + recommendation
    agent: investigator
    model: default
    phase: spec
    keep: true
    markers: [RECOMMEND, CONFLICTS]
    instructions: >-
      Write the spike's findings for the person who decides, and for the feature spec that may start from them (the
      researchers' reports follow yours in the report and the feature gets both, so carry their evidence, never
      summarise it away). Start with the summary, at most 12 lines, each section on its own line:
      "DECISION: <one sentence>"; "BEFORE BUILDING:" with at most 3 numbered open questions that block building
      (or "none"); "CONFLICTS: none | found" and under it, as a list, every point where the angles disagree (compare
      their Facts one by one), with the evidence for each side and which side the evidence supports; "COST: <files,
      migrations, size>"; "NEXT: spec | drop". Then the full findings, in this order: the question and the decision; Findings (evidence), a list
      where every claim has its file:line or URL, with the paths the change touches traced (inbound, internal messages
      and their contract, e.g. a schema with additionalProperties: false, and the old messages already queued at
      deploy, persistence, outbound); the tests that exist today for those paths (or none); gaps that need a product
      decision, called decisions, not facts (with the framing's open questions for the spec: how to build it is
      the spec interview's to ask, not this spike's); Unverified, each fact no source confirms with what must be confirmed and
      by whom; a comparison table (angle, verdict, the key numbers, risk, effort); for the recommended angle, draft
      acceptance criteria "AC-n [API|WEB|E2E|SMOKE] Given, when, then" that are testable and cover absent, valid, malformed, a
      later update, an old queued message and the docs; Test layers per draft criterion (unit, functional,
      integration, smoke, e2e, or why not); Risks and cost (files touched, migration or not, the rolling deploy order
      between producer and consumer, ambiguities to decide); for the recommended angle also what the feature spec's
      first sections need (keel's spec template): what will change, file by file; the payloads before and after (or
      none, and why); the database changes with the migration, its rollback and deploy order (or none, and why); and
      the request path through the layers; the sources with their URLs; open questions; and one
      recommendation with its reason. RECOMMEND is that recommendation on one line.

      The web research (sources and confidence):

      {{data.web_docs_text}}

      The researchers' answers:

      {{data.report}}
  - { id: report, kind: code, name: findings report, action: spike_report, phase: spec }
  - id: decide
    kind: gate
    name: spike result
    back: frame
    lock: true
    phase: spec
    choices: { spec: hand_spec, drop: end }
  - id: hand_spec
    kind: code
    name: start a feature flow from the findings
    action: start_flow
    flow: feature
    then: end
    phase: spec
    seed: { title: $title, evidence: $data.report }
