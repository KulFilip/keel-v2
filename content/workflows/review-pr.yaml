id: review-pr
name: review a PR (keel)
keel_rules: true
version: 1
# Someone else's change (a GitHub PR or a branch) against a ticket and the team's definition of done, plus build, lint
# and code quality. A large change gets one bug reviewer per area (migrations, deploy+config, message pipeline,
# persistence, api, tests …) with the lenses its files need; claims merges and dedupes their findings, compares what
# each read with what it was given (a review that read only part of the change is "partial" and names the unread files,
# one that read nothing stops), and sends every not-met item, blocking finding and undecided item to a second look. Read-only: nothing is fixed, committed or pushed, and nothing reaches the author unless you choose
# which sections to share and then choose post. Inputs: the request's first line names the PR (a number, #12, PR 12, its
# URL) or `branch: <name>`, the rest is the ticket; or StartThread.data (the api's options): pr, branch, base, ticket,
# force (review a draft, closed or docs-only change anyway). The team's checklist is .keel/dod.md (keel's starter list
# content/templates/dod.md without one). Prep stops before any agent on an empty diff, a closed or draft PR, only
# lockfiles or generated files, or only docs.
steps:
  - { id: prep, kind: code, name: prepare the review, action: ticket_prep, lock: true, phase: review }
  - { id: build, kind: code, name: build and lint in a throwaway worktree, action: ticket_build, phase: review }
  - id: reviewers
    kind: parallel
    name: one reviewer per job
    agent: pr-reviewer
    model: default
    from: ticket_jobs
    phase: review
    markers: [TICKET-REVIEW]
    instructions: >-
      Do only your item's job, against the reviewed version (the item's read commands), never the working tree. The
      ticket is the text the user gave, after the line that names the PR or branch. Items listed under decided are
      already judged by a script: skip them. Read the diff of every file in your list and start your answer with one
      READ line per file read (GAP | file | why for one you could not read). Go through each of your lenses. Answer in
      result lines only.
  - { id: claims, kind: code, name: claims to check, action: ticket_claims, phase: review }
  - id: check
    kind: parallel
    name: check each problem again
    agent: pr-reviewer
    model: default
    from: ticket_checks
    phase: review
    markers: [TICKET-REVIEW]
    instructions: >-
      Your item holds one claim another reviewer made (job check), or one checklist item nobody could decide (job
      settle). Read the code in the reviewed version: the lines it names, and what they call. A check answers
      CHECK | confirmed | <why> or CHECK | rejected | <why>; a settle answers CHECK | met | <file:line, why> or
      CHECK | not-met | <file:line, why>. Only when the code that decides it cannot be read: CHECK | unverified | <what
      you could not read>. Never leave it as a question for the person.
  - { id: record, kind: code, name: record the review, action: ticket_record, phase: review }
  - { id: share, kind: gate, name: the review, phase: review, choices: { done: end, share: share_text } }
  - { id: share_text, kind: code, name: the text for the author, action: ticket_share, phase: review }
  - { id: post, kind: gate, name: share with the author, phase: review, choices: { keep: end, post: post_comment } }
  - { id: post_comment, kind: code, name: post the comment, action: ticket_comment, phase: review }
