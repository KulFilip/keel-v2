# keel rule pack: strict secrets. More files hold secrets than .env; agents read none of them.
schema: 1
kind: rules
name: strict-secrets
title: Strict secrets
version: 1.0.0
publisher: keel
summary: Key files, credentials and secret folders are never read or changed by an agent, and the environment is not printed.
requires:
  keel: ">=0.17.2"
rules:
  - id: no-key-files
    kind: read
    match: ["**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/id_rsa*", "**/id_ed25519*", "**/credentials*", "**/secrets/**", "**/*.keystore", "**/*.jks"]
    reason: This file holds keys or credentials; they stay out of the conversation.
  - id: no-key-edits
    kind: edit
    match: ["**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/credentials*", "**/secrets/**", "**/*.keystore", "**/*.jks"]
    reason: Keys and credentials are changed by a person, never by an agent.
  - id: no-env-dump
    kind: bash
    how: regex
    match: ['(^|[;&|]\s*)(printenv|env)\s*($|[;&|>])', '(^|[;&|]\s*)set\s*($|[;&|>])', 'cat\s+\S*(\.pem|\.key|credentials)']
    reason: Printing the environment or a key file would put secrets in the conversation.
