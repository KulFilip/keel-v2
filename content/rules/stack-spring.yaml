# keel rule pack for Spring Boot / Gradle projects.
schema: 1
kind: rules
name: stack-spring
title: Spring Boot and Gradle
version: 1.0.0
publisher: keel
summary: The Gradle wrapper, production profiles and the build's plugin versions are changed by a person.
stack: spring
requires:
  keel: ">=0.17.2"
rules:
  - id: no-wrapper
    kind: edit
    match: ["**/gradle/wrapper/**", "**/gradlew", "**/gradlew.bat", "**/.mvn/wrapper/**", "**/mvnw"]
    reason: The build wrapper pins the build tool for everyone; a person updates it.
  - id: no-prod-profile
    kind: edit
    match: ["**/application-prod*.yml", "**/application-prod*.yaml", "**/application-prod*.properties"]
    reason: Production settings are changed by a person, outside the flow.
  - id: no-wrapper-upgrade
    kind: bash
    match: ["gradle wrapper", "--gradle-version"]
    reason: Upgrading Gradle is a person's decision.
