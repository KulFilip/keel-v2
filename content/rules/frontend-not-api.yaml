# keel rule pack: a frontend criterion never touches the backend.
schema: 1
kind: rules
name: frontend-not-api
title: Frontend can't touch the API
version: 1.0.0
publisher: keel
summary: While an agent works on a web criterion, the backend, the contract and the migrations are off limits.
requires:
  keel: ">=0.17.2"
rules:
  - id: web-lane-no-api
    kind: edit
    match: ["apps/api/**", "api/**", "backend/**", "server/**", "**/openapi.yaml", "**/openapi.json", "**/db/migration/**"]
    lanes: [web]
    reason: This is a web criterion. If the API must change, say so; it becomes its own API criterion.
