# Builds and tests this keel plugin against keel's source, at the keel-v2 commit in keel.ref
# (keel-v2: docs/plugins/16-steps5-7-contract.md, step 5). On every push to main and every pull request.
#
#   1 this repo into plugin/, and MiladNalbandi/keel-v2 at keel.ref into keel/
#   2 keel/scripts/build-plugin-repo.sh: the plugin goes into keel/plugins/<name>/ (keel Product: keel/product/), the
#     plugins it requires come from their keel-studio repos (the newest tag that fits) or keel-v2's own copy, then
#     keel's tests and build for each part it has (engine tests, api, web), keel-plugin pack and lint
#   3 the .kplug as the run's artifact (unsigned: only a tag's release is signed)
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: plugin, persist-credentials: false }
      - name: keel.ref
        id: keel
        run: |
          ref="$(sed -e 's/#.*//' -e 's/[[:space:]]//g' plugin/keel.ref | sed '/^$/d' | tail -n 1)"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || [[ "$ref" =~ ^0+$ ]]; then
            echo "::error::keel.ref must hold the keel-v2 commit this plugin builds against (40 hex characters), not '$ref'."
            exit 1
          fi
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { repository: MiladNalbandi/keel-v2, ref: "${{ steps.keel.outputs.sha }}", path: keel, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: keel/web/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - uses: astral-sh/setup-uv@v6
      # some of keel's tests make git commits
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - name: keel's build and tests for this plugin
        run: bash keel/scripts/build-plugin-repo.sh plugin dist --throwaway
      - uses: actions/upload-artifact@v4
        with: { name: kplug, path: dist/ }
